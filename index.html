<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>habsida</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="main">
  <div class="left">
    <div class="left-img">
    <img class="logo" src="assets/logo.svg" alt="logo ">
    </div>
  </div>
 <div class="right">
    <div class="heading-text1">
    <h1>Get iintoo it today</h1>
   <p>There is no charge or obligation upon registration.</p>
    </div>

<div class="registration">
    <button class="facebook"><img class="facebook-icon" src="assets/facebook.svg" alt="facebook image">Register with Facebook</button>
    <button class="linkedin"><img class="linkedin-icon" src="assets/linkedin.svg" alt="linkedin image">Register with Linkedin</button>
</div>

<div class="or">
    <div class="line"> </div>
    <span>OR</span>
    <div class="line"> </div>
</div>    

<form>
    <div class="form-contact">
       <div class="email">
    <label class="mail" for="email"> Email </label>
    <input type="email" id="email" >
    </div>
    <div class="phone">
    <label class="tell" for="tell"> Phone </label>
    <input type="tell" id="tell" >
    </div>
    </div>

<div class="heading-text2">
<h2>What type of investor are you?</h2>
<p>Select the type of investor you are below.</p>
</div>

<div class="form-selection">
    <div>
    <input type="radio" name="invest-type" id="individual">
    <label class="info" for="individual"> Individual <span class="helper-text">I am a natural person investing on my own behalf as a sole owner, joint tenant, or tenant in common.</span><img class="question" src="assets/question.png" alt="question"></label>
    </div>
    <div>
    <input type="radio" name="invest-type" id="business">
    <label class="info" for="business"> Business <span class="helper-text">I am a natural person investing on my own behalf as a sole owner, joint tenant, or tenant in common.</span><img class="question" src="assets/question.png" alt="question"></label>
    </div>
    <div>
    <input type="radio" name="invest-type" id="ira">
    <label class="info" for="ira"> IRA <span class="helper-text">I am a natural person investing on my own behalf as a sole owner, joint tenant, or tenant in common.</span><img class="question" src="assets/question.png" alt="question"></label>
    </div>
    <div>
    <input type="radio" name="invest-type" id="trust">
    <label class="info" for="trust"> Trust <span class="helper-text">I am a natural person investing on my own behalf as a sole owner, joint tenant, or tenant in common.</span><img class="question" src="assets/question.png" alt="question"></label>
    </div>
</div>

<div class="form-agree">
    <input type="checkbox" id="iagree">
    <label for="iagree">I agree to the terms and receiving notifications from iintoo <a href="">View full terms</a></label>
</div>

<button class="submit-btn">Create Account</button>
</form>
</div>

</div>
    
</body>
</html>
