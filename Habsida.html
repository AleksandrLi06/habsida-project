<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>habsida</title>
    <link rel="stylesheet" href="Habsida.css">
</head>
<body>
<div class="main">
  <div class="left">
    <div class="left-img">
    <img src="./bg.jpg" alt="левая сторона">
    </div>
  </div>
 <div class="right">
    <div class="heading-text1">
    <h1>Get iintoo it today</h1>
   <p>There is no charge or obligation upon registration.</p>
    </div>

<div class="registration">
    <button class="Facebook"><img class="facebook-icon" src="facebook.svg" alt="facebook image">Register with Facebook</button>
    <button class="Linkedin"><img class="linkedin-icon" src="linkedin.svg" alt="linkedin image">Register with Linkedin</button>
</div>

<div class="or">
    <div class="line"> </div>
    <span>OR</span>
    <div class="line"> </div>
</div>    

<form>
    <div class="form-contact">
    <input type="email" placeholder="Email">
    <input type="text" placeholder="Phone">
    </div>

<div class="heading-text2">
<h2>What type of investor are you?</h2>
<p>Select the type of investor you are below.</p>
</div>

<div class="form-selection">
    <div>
    <input type="radio" id="individual">
    <label class="info" for="individual">individual <span class="helper-text">I am a natural person investing on my own behalf as a sole owner, joint tenant, or tenant in common.</span><img class="question" src="question.png"></label>
    </div>
    <div>
    <input type="radio" id="business">
    <label class="info" for="business">business<span class="helper-text">I am a natural person investing on my own behalf as a sole owner, joint tenant, or tenant in common.</span><img class="question" src="question.png"></label>
    </div>
    <div>
    <input type="radio" id="ira">
    <label class="info" for="ira">IRA<span class="helper-text">I am a natural person investing on my own behalf as a sole owner, joint tenant, or tenant in common.</span><img class="question" src="question.png"></label>
    </div>
    <div>
    <input type="radio" id="trust">
    <label class="info" for="trust">Trust<span class="helper-text">I am a natural person investing on my own behalf as a sole owner, joint tenant, or tenant in common.</span><img class="question" src="question.png"></label>
    </div>
</div>

<div class="form-agree">
    <input type="checkbox" id="iagree">
    <label for="iagree">I agree to the terms and receiving notifications from iintoo <a href="">View full terms</a></label>
</div>

<button class="submit-btn">Create Account</button>
</form>
</div>

</div>
    
</body>
</html>
